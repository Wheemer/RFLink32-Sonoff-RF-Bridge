name: Publish signed RF Bridge firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --upgrade platformio

      - name: Verify tag matches the compiled firmware version
        run: python tools/check_release_version.py --tag "$GITHUB_REF_NAME"

      - name: Build the modified Sonoff RF Bridge firmware
        run: |
          for attempt in 1 2 3; do
            if pio run -e sonoff_bridge; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Validate OTA staging layout
        run: |
          python tools/generate_wifi_setup_asset.py RFLink/WifiSetupPage.html RFLink/WifiSetupPage_gz.h
          python tools/check_wifi_setup_page.py RFLink/12_Portal.cpp RFLink/WifiSetupPage.html RFLink/WifiSetupPage_gz.h RFLink/10_Wifi.cpp
          python tools/validate_ota_layout.py .pio/build/sonoff_bridge/firmware.bin
          python tools/check_ota_signing_lifecycle.py

      - name: Sign and package release assets
        env:
          SIGNING_KEY: ${{ secrets.RF_BRIDGE_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$SIGNING_KEY"
          umask 077
          trap 'rm -f signing.key' EXIT
          printf '%s' "$SIGNING_KEY" > signing.key
          VERSION="${VERSION#v}"
          ASSET_URL="https://github.com/${REPOSITORY}/releases/download/${GITHUB_REF_NAME}/firmware.bin.gz.signed"
          RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          python tools/check_ota_signing_identity.py \
            --private-key signing.key \
            --firmware-source RFLink/13_Update.cpp --signing-header RFLink/Updater_Signing.h --firmware .pio/build/sonoff_bridge/firmware.bin
          python tools/package_sonoff_bridge_update.py .pio/build/sonoff_bridge/firmware.bin \
            --private-key signing.key \
            --signing-tool "$HOME/.platformio/packages/framework-arduinoespressif8266/tools/signing.py" \
            --output-dir release \
            --version "$VERSION" \
            --artifact-url "$ASSET_URL" \
            --release-url "$RELEASE_URL"
          python tools/verify_signed_ota_artifact.py \
            release/firmware.bin.gz.signed \
            --signing-header RFLink/Updater_Signing.h
          full_image="release/RFBridge-${VERSION}-full.bin"
          cp .pio/build/sonoff_bridge/firmware.bin "$full_image"
          sha256sum "$full_image" > "$full_image.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              release/firmware.bin.gz.signed \
              release/manifest.json \
              release/RFBridge-"${GITHUB_REF_NAME#v}"-full.bin \
              release/RFBridge-"${GITHUB_REF_NAME#v}"-full.bin.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/firmware.bin.gz.signed \
              release/manifest.json \
              release/RFBridge-"${GITHUB_REF_NAME#v}"-full.bin \
              release/RFBridge-"${GITHUB_REF_NAME#v}"-full.bin.sha256 \
              --target "$target" \
              --generate-notes \
              --title "RF Bridge ${GITHUB_REF_NAME}"
          fi
