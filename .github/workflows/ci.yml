name: RF Bridge validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade platformio ruff

      - name: Validate firmware source
        run: |
          python tools/check_api_only_transport.py
          python tools/check_listener_topology.py
          python tools/check_sonoff_bridge_target.py
          python tools/check_ota_signing_lifecycle.py
          python tools/generate_wifi_setup_asset.py RFLink/WifiSetupPage.html RFLink/WifiSetupPage_gz.h
          python tools/check_wifi_setup_page.py RFLink/12_Portal.cpp RFLink/WifiSetupPage.html RFLink/WifiSetupPage_gz.h RFLink/10_Wifi.cpp
          ruff check tools
          python -m compileall -q tools

      - name: Build the modified Sonoff RF Bridge firmware
        run: |
          for attempt in 1 2 3; do
            if pio run -e sonoff_bridge; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Validate OTA layout
        run: python tools/validate_ota_layout.py .pio/build/sonoff_bridge/firmware.bin

      - name: Upload RF Bridge firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: modified-sonoff-rf-bridge-firmware
          path: .pio/build/sonoff_bridge/firmware.bin
