name: RF Bridge validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade platformio ruff homeassistant pyyaml

      - name: Validate Home Assistant integration
        run: |
          python tools/check_api_only_transport.py
          python tools/check_firmware_download_view.py
          python tools/check_listener_topology.py
          python tools/check_rf_bridge_websocket_reconnect.py
          python tools/check_rf_bridge_entity_availability.py
          python tools/check_sonoff_bridge_target.py
          python tools/check_wifi_setup_page.py RFLink/12_Portal.cpp
          ruff check custom_components/rf_bridge tools/check_api_only_transport.py tools/check_firmware_download_view.py tools/check_listener_topology.py tools/check_rf_bridge_websocket_reconnect.py tools/check_rf_bridge_entity_availability.py tools/check_sonoff_bridge_ota_layout.py tools/check_sonoff_bridge_target.py tools/check_wifi_setup_page.py tools/package_sonoff_bridge_update.py tools/validate_ota_layout.py
          python -m compileall -q custom_components/rf_bridge tools
          python - <<'PY'
          import json
          import yaml
          for path in (
              "custom_components/rf_bridge/manifest.json",
              "custom_components/rf_bridge/strings.json",
              "custom_components/rf_bridge/translations/en.json",
          ):
              with open(path, encoding="utf-8") as handle:
                  json.load(handle)
          with open("custom_components/rf_bridge/services.yaml", encoding="utf-8") as handle:
              yaml.safe_load(handle)
          import custom_components.rf_bridge
          import custom_components.rf_bridge.button
          import custom_components.rf_bridge.config_flow
          import custom_components.rf_bridge.event
          import custom_components.rf_bridge.sensor
          import custom_components.rf_bridge.update
          PY

      - name: Build the modified Sonoff RF Bridge firmware
        run: |
          for attempt in 1 2 3; do
            if pio run -e sonoff_bridge; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 15
          done

      - name: Validate OTA layout
        run: python tools/validate_ota_layout.py .pio/build/sonoff_bridge/firmware.bin

      - name: Upload RF Bridge firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: modified-sonoff-rf-bridge-firmware
          path: .pio/build/sonoff_bridge/firmware.bin
