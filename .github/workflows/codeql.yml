name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze firmware and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp, python
          build-mode: manual

      - name: Build the modified Sonoff RF Bridge firmware
        run: |
          python -m pip install --upgrade platformio
          pio run -e sonoff_bridge

      - name: Analyze
        uses: github/codeql-action/analyze@v4
