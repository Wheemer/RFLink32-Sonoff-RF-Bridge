[platformio]
src_dir = RFLink

[env:sonoff_bridge]
platform = espressif8266@4.1.0
board = esp8285
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
lib_ldf_mode = deep
; Plugins are included by RFLink/5_Plugin.cpp; compiling their source files a
; second time produces duplicate symbols at link time.
build_src_filter = +<*> -<Plugins>
; 3.1.2 has an upstream defect that makes signed, gzip-compressed updates
; fail when the final compressed block is not four-byte aligned. Pin the
; focused upstream repair instead of carrying a private core patch.
platform_packages = framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git#d7c50f76aa8a6110c0d7f9c10a10e6a6001b035e
extra_scripts = post:tools/check_sonoff_bridge_ota_layout.py
board_build.ldscript = eagle.flash.1m32ota.ld
upload_speed = 921600
lib_deps =
    ArduinoJson@~6.18.5
    esp32async/ESPAsyncWebServer @ ~3.12.0
    ESP8266WiFi
    ESP8266TrueRandom
    esp32async/ESPAsyncTCP @ ~2.0.0
build_flags =
; Make the generated public-key header visible while PlatformIO compiles the
; ESP8266 core itself. This enables the core's native signed-update path.
    -I RFLink
    -D TARGET_BOARD_ESP8285
    -D ARDUINOJSON_USE_LONG_LONG
    -D RFLINK_WIFI_ENABLED
    -D RFLINK_NO_RADIOLIB_SUPPORT
; API/WebSocket is the command transport. Keep the framework default UART RX
; buffer instead of reserving memory for the retired long-command serial path.
    -D RFLINK_SERIAL_RX_BUFFER_SIZE=512
; Bound telemetry broadcast backlog on the ESP8285.
    -D WS_MAX_QUEUED_MESSAGES=2
    -D RFLINK_BUILDNAME='"RFBridgeLocal"'
    -D RFLINK_FIRMWARE_VERSION='"1.0.32"'
    -D RFLINK_HARDWARE_NAME='"RFLink32 - Sonoff RF Bridge"'
    -D DEFAULT_WIFI_CLIENT_HOSTNAME='"RFBridge"'
; The modified Sonoff RF Bridge has fixed radio wiring.
    -D RFLINK_USE_HARDCODED_RADIO_PINS_ONLY
    -D RFLINK_SONOFF_BRIDGE_DIRECT_HACK
    -D RFLINK_SONOFF_BRIDGE_WIFI_LED_PIN=13
    -D PIN_RF_RX_DATA=4
    -D PIN_RF_RX_NMOS=-1
    -D PIN_RF_TX_DATA=5
    -D PPIN_RF_TX_NMOS=-1
; This firmware targets one direct-modified Sonoff RF Bridge. RX is a
; permanent asynchronous interrupt stream; it is not a user setting.
    -D RFLINK_SONOFF_BRIDGE_CONTINUOUS_RX
